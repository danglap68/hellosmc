# Local development services. Rails, Sidekiq and the Telegram poller run natively.
#   docker compose up -d
# Rails uses the host's PostgreSQL socket by default. To use this container
# instead, set DB_HOST=localhost DB_USERNAME=postgres DB_PASSWORD=postgres in .env
# (plus DB_PORT if you change POSTGRES_PORT because PostgreSQL already runs on the host).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:

# Coolify deployment (build pack "Docker Compose", compose location
# /docker-compose.coolify.yml): the web app and the Sidekiq worker. PostgreSQL
# and Redis are separate Coolify database resources (so Coolify's scheduled
# backups apply); enable "Connect To Predefined Network" on this resource so
# their internal hostnames resolve.
#
# Set the variables below under Environment Variables in Coolify and give the
# `web` service its domain; Coolify's proxy reaches it on port 80, nothing is
# published.
#
# Required: SECRET_KEY_BASE (`bin/rails secret`; signs sessions and cookies),
# DATABASE_URL, REDIS_URL (the databases' internal URLs), APP_HOST,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_ENDPOINT. The image
# build needs none of them, so make them runtime-only (untick "Available at
# Buildtime"): build-time variables are passed to `docker build` as build args
# and end up in the image history.
#
# First boot of `web` loads the schema into the empty database and seeds card
# types and the first admin (SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD; remove the
# password from Coolify once you can sign in). The Telegram bot token and
# webhook are then set under Cài đặt → Kết nối Telegram, not here.
#
# Environment lists are written out per service on purpose: no YAML anchors,
# so Coolify's compose parser shows every variable.
services:
  web:
    build: .
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_HOST: ${APP_HOST}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  worker:
    build: .
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_HOST: ${APP_HOST}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    restart: unless-stopped

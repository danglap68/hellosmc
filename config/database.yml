# Development and test use the local PostgreSQL socket; the optional DB_*
# variables override it (e.g. for the PostgreSQL in docker-compose.yml).
# Never set DATABASE_URL locally: it would point the test suite at that database.
<% if ENV["RAILS_ENV"] == "test" && ENV["DATABASE_URL"].to_s != "" %>
<% raise "Unset DATABASE_URL for tests; use DB_HOST/DB_PORT/DB_USERNAME/DB_PASSWORD instead so each worker uses its own test database." %>
<% end %>
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + ENV.fetch("SIDEKIQ_CONCURRENCY") { 5 }.to_i %>
  host: <%= ENV.fetch("DB_HOST", nil) %>
  port: <%= ENV.fetch("DB_PORT", nil) %>
  username: <%= ENV.fetch("DB_USERNAME", nil) %>
  password: <%= ENV.fetch("DB_PASSWORD", nil) %>

development:
  <<: *default
  database: hellosmc_development

test:
  <<: *default
  database: hellosmc_test<%= ENV.fetch("TEST_ENV_NUMBER", "") %>

# Production reads DATABASE_URL (merged over this block by Rails).
production:
  <<: *default
  database: hellosmc_production
